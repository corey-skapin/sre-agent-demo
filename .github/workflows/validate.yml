name: Validate demo assets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parser, skin and mocked behavior checks
        shell: pwsh
        run: .\tests\Invoke-Tests.ps1
      - name: Compile Bicep without Azure sign-in
        shell: pwsh
        run: |
          $compiled = Join-Path $env:RUNNER_TEMP 'sre-template.json'
          try {
            az bicep build --file .\infra\main.bicep --outfile $compiled --only-show-errors
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\tests\Test-SreTemplate.ps1 -TemplatePath $compiled
          } finally {
            if (Test-Path -LiteralPath $compiled) { Remove-Item -LiteralPath $compiled -Force }
          }
