name: Validate demo assets
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parser, skin and mocked behavior checks
        shell: pwsh
        run: .\tests\Invoke-Tests.ps1
      - name: PowerShell static analysis
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Scope CurrentUser -Force
          }
          $issues = @(Invoke-ScriptAnalyzer -Path .\scripts -Recurse -Severity Error,Warning)
          $issues | Format-Table ScriptName, Line, RuleName, Severity
          if (@($issues | Where-Object Severity -eq Error).Count) { exit 1 }
      - name: Markdown conventions
        shell: pwsh
        run: |
          $documents = @('AGENTS.md', 'README.md') + @(Get-ChildItem .\docs\*.md | ForEach-Object FullName)
          npx --yes markdownlint-cli2@0.23.3 @documents
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile Bicep without Azure sign-in
        shell: pwsh
        run: |
          $compiled = Join-Path $env:RUNNER_TEMP 'sre-template.json'
          try {
            az bicep build --file .\infra\main.bicep --outfile $compiled --only-show-errors
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            .\tests\Test-SreTemplate.ps1 -TemplatePath $compiled
          } finally {
            if (Test-Path -LiteralPath $compiled) { Remove-Item -LiteralPath $compiled -Force }
          }
